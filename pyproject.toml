[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "copula-active-subspaces"
version = "1.0.0"
description = "Copula Active Subspaces: score-covariance dimension reduction for non-Gaussian density estimation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Joshua Chen", email = "Joshua.Chen@colostate.edu" },
    { name = "Peter Jan van Leeuwen", email = "Peter.vanLeeuwen@colostate.edu" },
]
keywords = [
    "copula",
    "active-subspaces",
    "score-matching",
    "hermite-polynomials",
    "non-gaussian-noise",
    "bayesian-inverse-problems",
    "data-assimilation",
    "uncertainty-quantification",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "smoke: quick tests of the figure scripts",
]
